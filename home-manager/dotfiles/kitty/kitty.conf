# ==============================================================================
# kitty - Catppuccin Mocha & Electric Blue Motion Configuration
# ==============================================================================

# Typography
font_family      JetBrainsMono Nerd Font
font_size        11.0

# Cursor & Smooth Cursor Trail (kitty >= 0.37)
cursor                       #89b4fa
cursor_text_color            #1e1e2e
cursor_trail                 1
cursor_trail_decay           0.1 0.3
cursor_trail_start_threshold 2
cursor_trail_color           #288cff

# Smooth Scrolling & iGPU-Friendly Frame Pacing
sync_to_monitor  yes
repaint_delay    8
input_delay      2
momentum_scroll  0.96

# Catppuccin Mocha + Electric Blue Surface & Palette
background              #1e1e2e
foreground              #cdd6f4
background_opacity      0.92
selection_foreground    #1e1e2e
selection_background    #89b4fa
url_color               #89b4fa
window_padding_width    8

# Tab Bar
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #11111b
active_tab_background   #89b4fa
inactive_tab_foreground #a6adc8
inactive_tab_background #181825
