[general]
fullscreen = false
early-exit = true
initial-tool = "brush"
copy-command = "wl-copy"
annotation-size-factor = 1.0
output-filename = "/home/HoaHung/Pictures/Screenshots/Screenshot_%Y-%m-%d_%H-%M-%S.png"
save-after-copy = false
default-hide-toolbars = false
focus-toggles-toolbars = true
disable-notifications = false
action-on-enter = "save-to-clipboard"

[font]
family = "Roboto"
style = "Regular"

[color-palette]
palette = [
  "#89b4fa", # Electric Blue (Catppuccin Blue)
  "#f38ba8", # Red
  "#a6e3a1", # Green
  "#f9e2af", # Yellow
  "#cba6f7", # Mauve
  "#cdd6f4", # Text White
  "#1e1e2e", # Base Dark
]
