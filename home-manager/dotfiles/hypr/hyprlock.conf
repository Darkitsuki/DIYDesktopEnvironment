# ==============================================================================
# hyprlock - Catppuccin Mocha & Electric Blue Frosted-Glass Theme
# ==============================================================================

$base       = rgb(30, 30, 46)
$mantle     = rgb(24, 24, 37)
$surface0   = rgb(49, 50, 68)
$text       = rgb(205, 214, 244)
$subtext0   = rgb(166, 173, 200)
$blue       = rgb(137, 180, 250)
$electric   = rgb(40, 140, 255)
$green      = rgb(166, 227, 161)
$yellow     = rgb(249, 226, 175)
$red        = rgb(243, 139, 168)

general {
    hide_cursor = true
    grace = 2
    ignore_empty_input = true
    immediate_render = false
}

animations {
    enabled = true
    bezier = fluentDecel, 0.05, 0.9, 0.1, 1.0
    bezier = snappy, 0.2, 0.0, 0.0, 1.0
    animation = fadeIn, 1, 2.5, fluentDecel
    animation = fadeOut, 1, 2, snappy
    animation = inputFieldDots, 1, 1.6, fluentDecel
    animation = inputFieldFade, 1, 2.0, fluentDecel
    animation = inputFieldColors, 1, 1.8, snappy
}

background {
    monitor =
    # Use static wallpaper so blur always renders reliably (even when displays are DPMS-off).
    path = /home/HoaHung/Pictures/Wallpapers/LaptopVictus.jpg
    color = $base
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 1.05
    brightness = 0.72
    vibrancy = 0.18
    vibrancy_darkness = 0.0
}

# Vertical Clock — Hours (Top)
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H")</b>"
    color = $text
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(17, 17, 27, 0.65)
    position = 0, 210
    halign = center
    valign = center
}

# Vertical Clock — Minutes (Bottom, Electric Blue)
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%M")</b>"
    color = $blue
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(17, 17, 27, 0.65)
    position = 0, 85
    halign = center
    valign = center
}

# Date Label
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %b')"
    color = $subtext0
    font_size = 16
    font_family = Roboto
    position = 0, -15
    halign = center
    valign = center
}

# User Badge above Password Field
label {
    monitor =
    text =    $USER
    color = $subtext0
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 175
    halign = center
    valign = bottom
}

# Pill Password Input Field
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $blue $electric 45deg
    inner_color = rgba(24, 24, 37, 0.85)
    font_color = $text
    font_family = Roboto
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##a6adc8"><i>Enter Password...</i></span>
    hide_input = false
    rounding = -1
    check_color = $green
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, 115
    halign = center
    valign = bottom
}
