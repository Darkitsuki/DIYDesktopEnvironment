# ==============================================================================
# hyprlauncher - Catppuccin Mocha Frosted-Glass UI Configuration
# ==============================================================================
# Design & Aesthetic Specifications:
#   Palette:
#     - Base Background:  rgba(30, 30, 46, 0.88) / #1e1e2e (Mocha Base)
#     - Surface / Mantle: #181825 (Mantle) / #313244 (Surface0)
#     - Accent / Border:  #89b4fa (Mocha Blue) / #288cff (Electric Blue)
#     - Typography:       #cdd6f4 (Text) / #a6adc8 (Subtext0)
#     - Font Family:      JetBrainsMono Nerd Font / Roboto
#
# Geometry & Proportions:
#   - Window Size:        620 x 430 px (Compact Spotlight / Raycast proportion)
#   - Visible Capacity:   Bounded to 7-8 visible rows (prevents full-screen stretch)
#   - Compositor Blur:    Enforced via Hyprland layer-rule (namespace: hyprlauncher)
# ==============================================================================

general {
    grab_focus = true
    show_apps_on_open = true
}

cache {
    enabled = true
}

finders {
    default_finder = desktop
    desktop_prefix = 
    unicode_prefix = .
    math_prefix = =
    font_prefix = '
    desktop_launch_prefix = uwsm app --
    desktop_icons = true
}

ui {
    window_size = 620 430
}
