# ==============================================================================
# hyprtoolkit - Catppuccin Mocha Frosted-Glass & Electric Blue Theme
# ==============================================================================

# Palette & Colors (0xAARRGGBB notation)
background        = 0xd91e1e2e # Translucent Base (alpha ~0.85) for backdrop blur
base              = 0xe6181825 # Translucent Mantle (alpha ~0.90) for input/card surface
alternate_base    = 0xff313244 # Surface0 for selection highlight / hover pill
text              = 0xffcdd6f4 # Text
bright_text       = 0xfff5e0dc # Rosewater / Bright text
link_text         = 0xff89b4fa # Electric Blue / Lavender
accent            = 0xff89b4fa # Electric Blue accent (replaces teal highlight & border)
accent_secondary  = 0xff288cff # Vivid Electric Blue

# Geometry & Rounding
rounding_large    = 16
rounding_small    = 8

# Typography
font_family            = Roboto
font_family_monospace  = JetBrainsMono Nerd Font
font_size              = 11
h1_size                = 19
h2_size                = 15
h3_size                = 13
small_font_size        = 10

# Icon Theme
icon_theme        = Colloid-Catppuccin-Dark
