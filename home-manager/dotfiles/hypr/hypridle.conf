# ==============================================================================
# hypridle - Automated Idle, Lock & Power Management
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || (hyprlock && hyprctl notify -1 2500 "rgb(a6e3a1)" "fontsize:14   Welcome back, $USER")
    before_sleep_cmd = loginctl lock-session && sleep 0.5
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Dim laptop screen backlight after 2.5 minutes
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 15
    on-resume = brightnessctl -r
}

# 2. Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off displays (DPMS) after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# 4. Suspend system after 30 minutes
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
